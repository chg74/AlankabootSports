<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>العنكبوت سبورت | Alankaboot Sport</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{background:#08080a;color:#fff;overflow-x:hidden;width:100%}

#splash{position:fixed;inset:0;background:#08080a;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .8s}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{width:150px;height:150px;border-radius:50%;border:3px solid rgba(220,20,30,.3);padding:10px;animation:pulse 2s infinite;margin-bottom:20px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.splash-logo img{width:100%;height:100%;object-fit:contain}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.brand{color:#fff;font-size:26px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#fff,#dc1420,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.loader{width:38px;height:38px;border:3px solid rgba(220,20,30,.2);border-top:3px solid #dc1420;border-radius:50%;animation:spin 1s linear infinite;margin-top:18px}
@keyframes spin{to{transform:rotate(360deg)}}

#app{display:none;opacity:0;transition:opacity .5s;min-height:100vh;padding:16px;padding-bottom:80px}
#app.show{display:block;opacity:1}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:12px}
.hdr h1{font-size:22px;font-weight:900}
.hdr h1 span{color:#dc1420}
.hdr .logo{width:40px;height:40px;border-radius:50%;border:2px solid rgba(220,20,30,.4);padding:2px;background:#fff}

/* شاشة الأقسام */
.cats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.cat-card{background:#121216;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:14px;text-align:center;cursor:pointer;transition:.3s}
.cat-card:active{transform:scale(.97);border-color:#dc1420}
.cat-card .img-box{width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px;margin-bottom:10px}
.cat-card .img-box img{width:100%;height:100%;object-fit:contain}
.cat-card .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-card .cnt{font-size:11px;color:#666;margin-top:4px}

/* شاشة القنوات داخل القسم */
.channels-view{display:none}
.channels-view.show{display:block}
.channels-hdr{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.channels-hdr .back-cat{background:#121216;border:1px solid rgba(220,20,30,.3);color:#dc1420;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:'Cairo',sans-serif}
.channels-hdr h2{font-size:18px;font-weight:900;color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{background:#121216;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:12px;text-align:center;cursor:pointer;transition:.3s}
.card:active{transform:scale(.97);border-color:#dc1420}
.card .box{width:70px;height:70px;margin:0 auto 10px;border-radius:12px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px}
.card .box img{width:100%;height:100%;object-fit:contain}
.card .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{font-size:10px;color:#666;margin-top:4px}
.card .st.live{color:#dc1420;font-weight:700}
.card .st.live::before{content:'● ';animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}

.nav{position:fixed;bottom:0;left:0;right:0;background:#121216;border-top:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.nav-it{display:flex;flex-direction:column;align-items:center;color:#666;font-size:11px;font-weight:600;gap:4px}
.nav-it.active{color:#dc1420}
.nav-it svg{width:22px;height:22px;fill:currentColor}

/* شاشة المشاهدة */
#player{display:none;position:fixed;inset:0;background:#000;z-index:99999;flex-direction:column}
#player.show{display:flex}
.p-cont{flex:1;display:flex;justify-content:center;align-items:center;background:#000;position:relative;overflow:hidden}
.p-wrap{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:#000}
.p-wrap video{width:100%;height:100%;object-fit:contain;background:#000}
.back{position:absolute;top:20px;left:20px;z-index:100;background:rgba(220,20,30,.9);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-family:'Cairo',sans-serif;font-weight:700;font-size:13px;cursor:pointer}
.logo-ov{position:absolute;top:20px;right:20px;z-index:100;width:60px;height:60px;border-radius:50%;overflow:hidden;border:2px solid rgba(220,20,30,.5);background:#fff;padding:3px}
.logo-ov img{width:100%;height:100%;object-fit:contain}

/* شاشة التحميل داخل المشغل */
.loader-overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:50}
.loader-overlay .spinner{width:50px;height:50px;border:4px solid rgba(220,20,30,.2);border-top:4px solid #dc1420;border-radius:50%;animation:spin 1s linear infinite}
.loader-overlay .txt{color:#aaa;font-size:14px;font-weight:600;margin-top:16px}

@media(max-width:600px){
  .cats-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .cat-card .img-box{aspect-ratio:1}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  .card .box{width:60px;height:60px}
  .card .nm{font-size:11px}
  .hdr h1{font-size:18px}
  .logo-ov{width:50px;height:50px;top:10px;right:10px}
  .back{top:10px;left:10px;padding:7px 12px;font-size:12px}
}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo"><img src="https://marketplace.canva.com/Na9X8/MAHB7PNa9X8/1/tl/canva-spider-web-illustration-MAHB7PNa9X8.png"></div>
  <div class="brand">Alankaboot Sport</div>
  <p style="color:#666;margin-top:8px;font-size:13px">جاري التحميل...</p>
  <div class="loader"></div>
</div>

<div id="app">
  <div class="hdr">
    <h1>Alankaboot <span>Sport</span></h1>
    <img class="logo" src="https://marketplace.canva.com/Na9X8/MAHB7PNa9X8/1/tl/canva-spider-web-illustration-MAHB7PNa9X8.png">
  </div>
  
  <!-- شاشة الأقسام -->
  <div id="catsView" class="cats-grid"></div>
  
  <!-- شاشة القنوات داخل القسم -->
  <div id="chView" class="channels-view">
    <div class="channels-hdr">
      <button class="back-cat" onclick="showCats()">← الأقسام</button>
      <h2 id="catTitleView"></h2>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  
  <div class="nav">
    <div class="nav-it active"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>الرئيسية</span></div>
    <div class="nav-it"><svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg><span>الأفلام</span></div>
    <div class="nav-it"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg><span>الرياضة</span></div>
  </div>
</div>

<div id="player">
  <div class="p-cont">
    <div class="p-wrap" id="pWrap">
      <video id="video" playsinline webkit-playsinline></video>
      <button class="back" onclick="closeP()">← رجوع</button>
      <div class="logo-ov"><img id="pLogo" src=""></div>
      <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
        <div class="txt">جاري التحميل...</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUc2C9hG9VE7RECiW19QXjNZqVH96sFE",
  authDomain: "zezo-59a8d.firebaseapp.com",
  databaseURL: "https://zezo-59a8d-default-rtdb.firebaseio.com",
  projectId: "zezo-59a8d",
  storageBucket: "zezo-59a8d.firebasestorage.app",
  messagingSenderId: "49183098248",
  appId: "1:49183098248:web:37e3fb16744042a1bb263d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let DATA = { categories: {} };
let currentCat = null;
const $ = id => document.getElementById(id);

onValue(ref(db, 'categories'), (snap) => {
  DATA.categories = snap.val() || {};
  renderCatsView();
  if(currentCat) renderChView(currentCat);
});

setTimeout(()=>{
  $('splash').classList.add('hide');
  setTimeout(()=>{
    $('splash').style.display='none';
    $('app').classList.add('show');
  },700);
},2200);

// عرض الأقسام
function renderCatsView(){
  const c = $('catsView');
  const list = Object.entries(DATA.categories).map(([id, v]) => ({id, ...v}));
  if(!list.length){
    c.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#666;padding:40px">لا توجد أقسام</p>';
    return;
  }
  c.innerHTML = list.map(cat => {
    const count = cat.channels ? Object.keys(cat.channels).length : 0;
    return `<div class="cat-card" onclick="openCat('${cat.id}')">
      <div class="img-box"><img src="${cat.image || 'https://marketplace.canva.com/Na9X8/MAHB7PNa9X8/1/tl/canva-spider-web-illustration-MAHB7PNa9X8.png'}" onerror="this.src='https://marketplace.canva.com/Na9X8/MAHB7PNa9X8/1/tl/canva-spider-web-illustration-MAHB7PNa9X8.png'"></div>
      <div class="nm">${cat.name}</div>
      <div class="cnt">${count} قناة</div>
    </div>`;
  }).join('');
}

// فتح قسم
window.openCat = function(id){
  currentCat = id;
  $('catsView').style.display = 'none';
  $('chView').classList.add('show');
  $('catTitleView').textContent = DATA.categories[id].name;
  renderChView(id);
};

// العودة للأقسام
window.showCats = function(){
  currentCat = null;
  $('chView').classList.remove('show');
  $('catsView').style.display = 'grid';
};

// عرض القنوات داخل القسم
function renderChView(catId){
  const cat = DATA.categories[catId];
  const g = $('grid');
  if(!cat || !cat.channels || !Object.keys(cat.channels).length){
    g.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#666;padding:40px">لا توجد قنوات في هذا القسم</p>';
    return;
  }
  g.innerHTML = Object.entries(cat.channels).map(([chId, ch]) => `
    <div class="card" onclick="play('${catId}','${chId}')">
      <div class="box"><img src="${ch.logo||'https://marketplace.canva.com/Na9X8/MAHB7PNa9X8/1/tl/canva-spider-web-illustration-MAHB7PNa9X8.png'}" onerror="this.src='https://marketplace.canva.com/Na9X8/MAHB7PNa9X8/1/tl/canva-spider-web-illustration-MAHB7PNa9X8.png'"></div>
      <div class="nm">${ch.name}</div>
      <div class="st ${ch.status==='live'?'live':''}">${ch.status==='live'?'مباشر':'غير متاح'}</div>
    </div>`).join('');
}

let hls = null, mpeg = null;

window.play = function(catId, chId){
  const ch = DATA.categories[catId].channels[chId];
  if(!ch) return;
  if(ch.status !== 'live'){ alert('القناة غير متاحة'); return; }
  
  $('pLogo').src = ch.logo || 'https://marketplace.canva.com/Na9X8/MAHB7PNa9X8/1/tl/canva-spider-web-illustration-MAHB7PNa9X8.png';
  
  // 1. إظهار المشغل مع شاشة التحميل
  $('player').classList.add('show');
  document.body.style.overflow = 'hidden';
  $('loaderOverlay').style.display = 'flex';
  
  // 2. ⚡ الشاشة الكاملة فوراً (داخل نفس الضغطة)
  const el = $('pWrap');
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  
  // 3. بدء تشغيل البث
  startStream(ch.url);
  speak();
};

// 🚀 حل مشكلة الروابط: بروكسي allorigins.win
function startStream(url){
  const v = $('video');
  if(hls){ hls.destroy(); hls=null; }
  if(mpeg){ mpeg.destroy(); mpeg=null; }
  v.removeAttribute('src'); v.load();

  // تحويل جميع الروابط إلى https عبر بروكسي allorigins
  let finalUrl = url;
  if(url.startsWith('http://')){
    finalUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
  }

  if(finalUrl.includes('.m3u8')){
    if(Hls.isSupported()){
      hls = new Hls({ lowLatencyMode:true, enableWorker:true });
      hls.loadSource(finalUrl); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        $('loaderOverlay').style.display = 'none';
        v.play().catch(()=>{});
      });
      hls.on(Hls.Events.ERROR, (e, d) => {
        if(d.fatal){
          if(d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if(d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        }
      });
    } else if(v.canPlayType('application/vnd.apple.mpegurl')){
      v.src = finalUrl; v.play().catch(()=>{});
      $('loaderOverlay').style.display = 'none';
    }
  } else if(finalUrl.includes('.ts')){
    if(mpegts.getFeatureList().mseLivePlayback){
      mpeg = mpegts.createPlayer({ type:'mpegts', isLive:true, url: finalUrl });
      mpeg.attachMediaElement(v); 
      mpeg.on(mpegts.Events.ERROR, () => { $('loaderOverlay').style.display = 'none'; });
      mpeg.load(); 
      mpeg.play();
      setTimeout(()=>{ $('loaderOverlay').style.display = 'none'; }, 1500);
    } else { 
      v.src = finalUrl; v.play().catch(()=>{}); 
      $('loaderOverlay').style.display = 'none';
    }
  } else {
    v.src = finalUrl; v.play().catch(()=>{});
    $('loaderOverlay').style.display = 'none';
  }
}

window.closeP = function(){
  $('player').classList.remove('show');
  document.body.style.overflow = '';
  const v = $('video');
  if(hls){ hls.destroy(); hls=null; }
  if(mpeg){ mpeg.destroy(); mpeg=null; }
  v.pause(); v.removeAttribute('src'); v.load();
  if(document.fullscreenElement || document.webkitFullscreenElement){
    if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
};

function speak(){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance('أهلاً بيكم في تطبيق العنكبوت سبورت. مشاهدة ممتعة.');
  u.lang = 'ar-EG'; u.rate = 0.95;
  const voices = window.speechSynthesis.getVoices();
  const ar = voices.find(x => x.lang && x.lang.startsWith('ar'));
  if(ar) u.voice = ar;
  window.speechSynthesis.speak(u);
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  window.speechSynthesis.getVoices();
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') closeP(); });
</script>
</body>
    </html>
