<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Alankaboot Sport</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg-color: #0d1117;
    --card-bg: #161b22;
    --border-color: #30363d;
    --text-main: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #2f81f7;
    --danger: #f85149;
  }
  *{box-sizing:border-box;font-family:'Cairo',sans-serif;margin:0;padding:0;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  body{background:var(--bg-color);color:var(--text-main);min-height:100vh;overflow-x:hidden}

  /* شاشة البداية */
  #splash{position:fixed;inset:0;background:var(--bg-color);display:flex;flex-direction:column;
    justify-content:center;align-items:center;z-index:9999;transition:opacity .5s}
  #splash.hide{opacity:0;pointer-events:none}
  .spinner{width:50px;height:50px;border:4px solid var(--border-color);
    border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .brand-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:1px}
  .brand-sub{font-size:14px;color:var(--text-muted);margin-top:8px}

  /* الواجهة الرئيسية */
  #app{display:none;opacity:0;transition:opacity .5s;padding:20px;min-height:100vh}
  #app.show{display:block;opacity:1}

  .header{display:flex;justify-content:space-between;align-items:center;
    padding-bottom:20px;border-bottom:1px solid var(--border-color);margin-bottom:20px}
  .header h1{font-size:20px;color:#fff;font-weight:700}
  .header .icon-btn{background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:8px}

  .section-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:15px;
    display:flex;align-items:center;gap:8px}
  .section-title::before{content:'';width:4px;height:16px;background:var(--accent);border-radius:2px}

  /* شبكة الأقسام والقنوات */
  .grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px}
  .tile{background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;
    padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;cursor:pointer;transition:transform .2s, border-color .2s}
  .tile:active{transform:scale(.96)}
  .tile:hover{border-color:var(--accent)}
  .tile img{width:60px;height:60px;object-fit:contain;border-radius:8px;background:var(--bg-color);padding:5px}
  .tile .title{font-size:14px;font-weight:600;color:#fff;text-align:center}
  .tile .sub{font-size:11px;color:var(--text-muted)}
  
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
  .empty-state svg{width:60px;height:60px;fill:var(--border-color);margin-bottom:15px}
  .empty-state p{font-size:14px;line-height:1.6}

  .back-btn{display:inline-flex;align-items:center;gap:8px;background:transparent;
    border:1px solid var(--border-color);color:var(--text-main);padding:8px 16px;
    border-radius:8px;font-size:13px;cursor:pointer;margin-bottom:20px;font-family:inherit}

  /* ===== المشغل الجديد (شبه الصورة التانية) ===== */
  #streamView{display:none;position:fixed;inset:0;background:#000;z-index:1000;flex-direction:column}
  #streamView.show{display:flex}
  
  .player-wrapper{flex:1;position:relative;display:flex;justify-content:center;align-items:center;background:#000}
  .video-element{width:100%;height:100%;object-fit:contain;display:block;background:#000}

  /* أزرار التحكم الجديدة */
  .controls-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, rgba(0,0,0,0.9));
    padding:15px 20px;display:flex;align-items:center;gap:15px;transition:opacity .3s}
  .controls-overlay.hidden{opacity:0;pointer-events:none}
  
  .ctrl-icon{background:none;border:none;color:#fff;width:36px;height:36px;display:flex;
    justify-content:center;align-items:center;cursor:pointer;padding:0}
  .ctrl-icon svg{width:24px;height:24px;fill:#fff}
  
  .progress-bar-container{flex:1;display:flex;align-items:center;gap:10px}
  .progress-bar{flex:1;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;
    position:relative;cursor:pointer}
  .progress-fill{height:100%;background:var(--accent);border-radius:2px;width:0%;transition:width .1s}
  .time-text{font-size:12px;color:#fff;font-weight:600;white-space:nowrap;min-width:45px;text-align:center}
  
  .close-player{position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.5);
    border-radius:50%;width:40px;height:40px;display:flex;justify-content:center;align-items:center;
    border:none;color:#fff;cursor:pointer;z-index:10}

  /* شاشة التحميل والخطأ داخل المشغل */
  .video-msg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    align-items:center;color:var(--text-muted);gap:15px;background:#000;z-index:5}
  .video-msg svg{width:50px;height:50px;fill:var(--border-color)}
  .video-msg span{font-size:14px;font-weight:600}

</style>
</head>
<body>

<div id="splash">
  <div class="spinner"></div>
  <div class="brand-title">Alankaboot Sport</div>
  <div class="brand-sub">جاري التحميل...</div>
</div>

<div id="app">
  <div class="header">
    <h1>Alankaboot Sport</h1>
    <a href="https://t.me/alankabootsport" target="_blank" class="icon-btn">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="#8b949e"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
    </a>
  </div>

  <div id="categoriesView">
    <div class="section-title">الأقسام المتاحة</div>
    <div id="categoriesContainer" class="grid"></div>
  </div>

  <div id="channelsView" style="display:none">
    <button class="back-btn" onclick="backToCategories()">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M15 18l-6-6 6-6v12z"/></svg>
      رجوع للأقسام
    </button>
    <div class="section-title" id="channelTitle">قنوات القسم</div>
    <div id="channelsContainer" class="grid"></div>
  </div>
</div>

<!-- المشغل الجديد -->
<div id="streamView">
  <div class="player-wrapper" id="playerWrapper">
    <button class="close-player" onclick="closeStream()">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    
    <!-- شاشة الخطأ / التحميل -->
    <div class="video-msg" id="videoMsg">
      <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
      <span id="videoMsgText">جاري الاتصال بالبث...</span>
    </div>

    <video id="video" class="video-element" playsinline webkit-playsinline></video>

    <!-- شريط التحكم (شبه الصورة التانية) -->
    <div class="controls-overlay" id="controlsOverlay">
      <!-- زر التشغيل/الإيقاف على الشمال -->
      <button class="ctrl-icon" onclick="togglePlay()" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- شريط التقدم والوقت في النص -->
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time-text" id="timeText">مباشر</span>
      </div>

      <!-- أزرار التحكم في اليمين (ملء الشاشة و PiP) -->
      <button class="ctrl-icon" onclick="togglePiP()" id="pipBtn" title="صورة داخل صورة">
        <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
      </button>
      
      <button class="ctrl-icon" onclick="toggleFullscreen()" id="fsBtn" title="ملء الشاشة">
        <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  // ==========================================================
  // 1. الإعدادات الأساسية والبروكسي
  // ==========================================================
  // مهم جداً: لو الرابط الأصلي http، لازم يعدي على البروكسي ده عشان يشتغل على https
  const PROXY_BASE = 'https://alankaboot-proxy.kamlnot61.workers.dev';
  const buildProxyUrl = (orig) => PROXY_BASE + '/proxy?url=' + encodeURIComponent(orig);

  // إعدادات MQTT (استقبال البيانات من لوحة التحكم)
  const BROKER = 'wss://broker.emqx.io:8084/mqtt';
  const TOPIC_DATA = 'kwtspta_9f3a2b1c/data';
  const TOPIC_HB = 'kwtspta_9f3a2b1c/hb';
  const MY_ID = 'v_' + Math.random().toString(36).slice(2, 10);

  const $ = id => document.getElementById(id);
  const splash = $('splash'), app = $('app');
  const streamView = $('streamView'), video = $('video');
  const playerWrapper = $('playerWrapper');
  const videoMsg = $('videoMsg'), videoMsgText = $('videoMsgText');
  const controlsOverlay = $('controlsOverlay');
  const playIcon = $('playIcon'), fsIcon = $('fsIcon');
  const progressFill = $('progressFill'), timeText = $('timeText');
  const progressBar = $('progressBar');

  let hls = null, currentCatId = null, data = { categories: [] };
  let controlsTimeout = null;

  // إخفاء شاشة البداية بعد ثانيتين
  setTimeout(() => {
    splash.classList.add('hide');
    setTimeout(() => { splash.style.display = 'none'; app.classList.add('show'); }, 500);
  }, 2000);

  // ==========================================================
  // 2. الاتصال بـ MQTT واستقبال القنوات
  // ==========================================================
  const client = mqtt.connect(BROKER, { clientId: MY_ID });
  client.on('connect', () => {
    client.subscribe(TOPIC_DATA);
    client.publish(TOPIC_HB, JSON.stringify({ id: MY_ID }));
    setInterval(() => client.publish(TOPIC_HB, JSON.stringify({ id: MY_ID })), 5000);
  });

  client.on('message', (topic, msg) => {
    try {
      const d = JSON.parse(msg.toString());
      if (topic === TOPIC_DATA) {
        data = d && Array.isArray(d.categories) ? d : { categories: [] };
        render();
      }
    } catch (e) {}
  });

  // ==========================================================
  // 3. عرض الأقسام والقنوات
  // ==========================================================
  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function render() {
    if (currentCatId) {
      const cat = data.categories.find(c => c.id === currentCatId);
      if (cat) { renderChannels(cat); return; }
      else { backToCategories(); return; }
    }
    renderCategories();
  }

  function renderCategories() {
    $('categoriesView').style.display = 'block';
    $('channelsView').style.display = 'none';
    currentCatId = null;

    const cats = data.categories || [];
    if (!cats.length) {
      $('categoriesContainer').innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1;">
          <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
          <p>لا توجد قنوات حالياً.<br>في انتظار إضافة القنوات من الإدارة.</p>
        </div>`;
      return;
    }

    $('categoriesContainer').innerHTML = cats.map(c => `
      <div class="tile" onclick="openCategory('${c.id}')">
        ${c.logo ? `<img src="${esc(c.logo)}" onerror="this.style.display='none'">` : ''}
        <div class="title">${esc(c.name || 'قسم')}</div>
        <div class="sub">${(c.channels || []).length} قناة</div>
      </div>
    `).join('');
  }

  function openCategory(catId) {
    const cat = data.categories.find(c => c.id === catId);
    if (!cat) return;
    currentCatId = catId;
    renderChannels(cat);
  }

  function backToCategories() {
    currentCatId = null;
    renderCategories();
  }

  function renderChannels(cat) {
    $('categoriesView').style.display = 'none';
    $('channelsView').style.display = 'block';
    $('channelTitle').textContent = cat.name || 'القنوات';

    const chs = cat.channels || [];
    if (!chs.length) {
      $('channelsContainer').innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1;">
          <p>لا توجد قنوات في هذا القسم.</p>
        </div>`;
      return;
    }

    $('channelsContainer').innerHTML = chs.map(ch => {
      const live = !!ch.live;
      return `
        <div class="tile" onclick="openChannel('${cat.id}', '${ch.id}')" style="opacity: ${live ? '1' : '0.5'}">
          ${ch.logo ? `<img src="${esc(ch.logo)}" onerror="this.style.display='none'">` : ''}
          <div class="title">${esc(ch.name || 'قناة')}</div>
          ${live ? '<div class="sub" style="color:var(--danger)">● مباشر</div>' : '<div class="sub">غير متاح</div>'}
        </div>`;
    }).join('');
  }

  // ==========================================================
  // 4. تشغيل الفيديو (القلب الأساسي)
  // ==========================================================
  function openChannel(catId, chId) {
    const cat = data.categories.find(c => c.id === catId);
    if (!cat) return;
    const ch = (cat.channels || []).find(c => c.id === chId);
    if (!ch) return;

    if (!ch.originalUrl) {
      alert('الرابط غير متوفر لهذه القناة');
      return;
    }

    // تهيئة المشغل
    streamView.classList.add('show');
    document.body.style.overflow = 'hidden';
    videoMsg.style.display = 'flex';
    videoMsgText.textContent = 'جاري الاتصال بالبث...';
    
    // بناء رابط البروكسي (مهم جداً لتخطي حماية CORS)
    const streamUrl = buildProxyUrl(ch.originalUrl);
    
    // تشغيل الفيديو
    playStream(streamUrl);
    
    // طلب ملء الشاشة تلقائياً
    toggleFullscreen(true);
    
    // إخفاء أزرار التحكم بعد 3 ثواني
    resetControlsTimeout();
  }

  function playStream(url) {
    if (hls) { hls.destroy(); hls = null; }

    if (Hls.isSupported()) {
      hls = new Hls({
        // إعدادات افتراضية عشان تستقر مع أغلب السيرفرات
        enableWorker: true,
        lowLatencyMode: false, // تم إيقافها لأنها بتسبب مشاكل مع بعض السيرفرات
        backBufferLength: 90
      });
      
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        videoMsg.style.display = 'none';
        video.play().catch(() => {
          // لو المتصفح رفض التشغيل التلقائي بالصوت، نشغل بدون صوت ونطلب من المستخدم يدوس
          video.muted = true;
          video.play().then(() => {
            showToast('اضغط على الشاشة لتشغيل الصوت');
          }).catch(() => {
            videoMsg.style.display = 'flex';
            videoMsgText.textContent = 'اضغط لتشغيل الفيديو';
          });
        });
      });

      hls.on(Hls.Events.ERROR, (e, d) => {
        if (d.fatal) {
          if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
            videoMsgText.textContent = 'خطأ في الشبكة، جاري المحاولة...';
            hls.startLoad();
          } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else {
            videoMsgText.textContent = 'فشل تشغيل البث (تأكد من الرابط أو البروكسي)';
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // دعم Safari و iOS
      video.src = url;
      video.addEventListener('loadedmetadata', () => {
        videoMsg.style.display = 'none';
        video.play().catch(() => {
          video.muted = true;
          video.play();
        });
      });
    }
  }

  // ==========================================================
  // 5. التحكم في المشغل (Play, Seek, Fullscreen, PiP)
  // ==========================================================
  
  // إخفاء وإظهار أزرار التحكم
  function resetControlsTimeout() {
    controlsOverlay.classList.remove('hidden');
    clearTimeout(controlsTimeout);
    controlsTimeout = setTimeout(() => {
      if (!video.paused) controlsOverlay.classList.add('hidden');
    }, 3000);
  }

  playerWrapper.addEventListener('click', (e) => {
    if (e.target.closest('.controls-overlay') || e.target.closest('.close-player')) return;
    if (controlsOverlay.classList.contains('hidden')) {
      resetControlsTimeout();
    } else {
      controlsOverlay.classList.add('hidden');
    }
  });

  // تشغيل / إيقاف
  function togglePlay() {
    if (video.paused) {
      video.play().catch(()=>{});
      video.muted = false; // محاولة إلغاء الكتم عند التشغيل اليدوي
    } else {
      video.pause();
    }
  }

  video.addEventListener('play', () => { playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'; resetControlsTimeout(); });
  video.addEventListener('pause', () => { playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; controlsOverlay.classList.remove('hidden'); });

  // شريط التقدم
  video.addEventListener('timeupdate', () => {
    if (video.duration && isFinite(video.duration)) {
      const pct = (video.currentTime / video.duration) * 100;
      progressFill.style.width = pct + '%';
      timeText.textContent = fmt(video.currentTime);
    } else {
      progressFill.style.width = '100%';
      timeText.textContent = 'مباشر';
    }
  });

  function fmt(s) {
    if (!s || isNaN(s) || !isFinite(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  // التقديم (Seek)
  let isDragging = false;
  function seek(e) {
    if (!video.duration || !isFinite(video.duration)) return;
    const rect = progressBar.getBoundingClientRect();
    let p = (e.clientX - rect.left) / rect.width;
    p = Math.max(0, Math.min(1, p));
    video.currentTime = p * video.duration;
    progressFill.style.width = (p * 100) + '%';
  }
  progressBar.addEventListener('pointerdown', e => { isDragging = true; seek(e); e.preventDefault(); });
  progressBar.addEventListener('pointermove', e => { if (isDragging) { seek(e); e.preventDefault(); } });
  progressBar.addEventListener('pointerup', () => isDragging = false);
  progressBar.addEventListener('pointercancel', () => isDragging = false);

  // ملء الشاشة وتدوير الشاشة
  function toggleFullscreen(forceOn = false) {
    const isFS = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFS || forceOn) {
      const el = playerWrapper;
      if (el.requestFullscreen) {
        el.requestFullscreen().then(() => {
          // محاولة تدوير الشاشة
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }).catch(()=>{});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
      }
    } else {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  // تحديث أيقونة ملء الشاشة عند التغيير
  document.addEventListener('fullscreenchange', updateFsIcon);
  document.addEventListener('webkitfullscreenchange', updateFsIcon);
  function updateFsIcon() {
    const isFS = document.fullscreenElement || document.webkitFullscreenElement;
    fsIcon.innerHTML = isFS 
      ? '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>' // أيقونة تصغير
      : '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>'; // أيقونة تكبير
  }

  // صورة داخل صورة (PiP)
  function togglePiP() {
    if (document.pictureInPictureElement) {
      document.exitPictureInPicture().catch(()=>{});
    } else if (document.pictureInPictureEnabled) {
      video.requestPictureInPicture().catch(()=>{});
    } else {
      alert('هذه الميزة غير مدعومة في متصفحك');
    }
  }

  // إغلاق المشغل
  function closeStream() {
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
    streamView.classList.remove('show');
    document.body.style.overflow = '';
    
    // إلغاء ملء الشاشة وتدوير الشاشة
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }

  // دالة مساعدة لإظهار رسالة
  function showToast(msg) {
    // ممكن تعمل هنا Toast حقيقي، بس للتبسيط هنستخدم alert أو console
    console.log(msg);
  }

</script>
</body>
</html>
